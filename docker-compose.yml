# Local development database. Integration tests do NOT use this —
# they start their own throwaway Postgres via Testcontainers.
services:
  postgres:
    # Keep in sync with the image in TestcontainersConfiguration.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      # Host port overridable (POSTGRES_PORT=5433) if 5432 is taken by another
      # project; set the same variable when running the app.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
